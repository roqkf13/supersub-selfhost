# MinIO — S3 대체.
#
# 🔴 **이미지는 Docker Hub 가 아니라 quay.io 다** (2026-09-22 실측). Docker Hub 의
#    `minio/minio` 에서 `latest` 태그가 **없어졌다** — 받으면
#    `pull access denied, repository does not exist or may require authorization`
#    가 나온다. "authorization" 이라고 적혀 있어서 자격증명 문제로 오해하기 쉬운데
#    **태그가 사라진 것**이다.
#    quay.io 에는 `latest` 도 있지만 **정식 RELEASE 로 고정한다** — `latest` 는
#    말없이 움직여서 "어제는 됐는데" 가 생긴다. `-cpuv1` 붙은 것은 구형 CPU 용이다.
#
# 🔴 앱 코드는 안 고쳤다. botocore 가 `AWS_ENDPOINT_URL_S3` 환경변수를 읽어
#    엔드포인트를 갈아 끼우고(1.43.87 확인), 사전 서명 URL 도 path-style 로
#    떨어져 MinIO 기본과 맞는다. 앱이 쓰는 연산 일곱 개 전부 지원된다.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: supersub
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: supersub
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO 볼륨
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--console-address", ":9001", "--certs-dir", "/certs"]
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          envFrom:
            - secretRef: { name: supersub-minio }
          volumeMounts:
            - { name: data, mountPath: /data }
            # 🔴 인증서를 넣으면 MinIO 가 **9000 을 HTTPS 로** 받는다. 백엔드가
            #    Cloudflare 를 안 지나고 같은 호스트 이름으로 직결하기 위한 것이다
            #    (README 「HEAD 첫 요청 403」). 브라우저는 여전히 Cloudflare 가
            #    주는 진짜 인증서를 보므로 이 자체 서명은 밖으로 안 나간다.
            - { name: tls, mountPath: /certs, readOnly: true }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000, scheme: HTTPS }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
        - name: tls
          secret: { secretName: minio-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: supersub
spec:
  # 🔴 NodePort 인 이유: **분석 워커가 호스트에서 돈다.** GPU 를 쓰려면 파드가
  #    아니라 호스트여야 하는데(WSL 에 nvidia device plugin 을 안 깔았다),
  #    호스트에서는 ClusterIP 가 안 보인다. 포트포워드는 죽으면 조용히 끊기고,
  #    공개 주소로 가면 Cloudflare 를 한 바퀴 돈다 — 둘 다 싫어서 NodePort 다.
  #    인증서 SAN 에 `localhost`·`127.0.0.1` 을 넣어 둔 것이 여기서 쓰인다.
  type: NodePort
  selector: { app: minio }
  ports:
    # 🔴 443 은 **백엔드 직결용**이다. 백엔드는 `https://supersub-storage.example.com`
    #    (기본 포트 443)으로 부르고, hostAliases 가 그 이름을 이 서비스로 보낸다.
    - { name: https, port: 443, targetPort: 9000 }
    - { name: api, port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# 버킷을 한 번 만든다. 다시 돌려도 안전하다(`--ignore-existing`).
# 🔴 `MC_HOST_local=http://user:pass@host` 꼴을 쓰지 않는다 — 비밀번호에 `@`·`/`
#    가 들어가면 URL 이 깨진다. `mc alias set` 은 인자로 받아 안전하다.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: supersub
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          envFrom:
            - secretRef: { name: supersub-minio }
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 🔴 https 다 — MinIO 에 인증서를 붙인 뒤로 9000 이 TLS 다.
              #    http 로 두면 **깨끗한 환경에서만** 여기서 영원히 기다린다(이미
              #    돌던 환경은 TLS 전에 이 Job 이 끝나 있어서 안 드러났다).
              #    클러스터 안이라 --insecure 로 자체 서명을 넘긴다.
              until mc --insecure alias set local https://minio:9000 \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "MinIO 를 기다린다..."; sleep 3
              done
              mc --insecure mb --ignore-existing local/supersub
              echo "버킷 준비됨: supersub"
